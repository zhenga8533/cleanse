[package]
name = "cleanse-platform"
description = "Read-only, per-OS filesystem facts for Cleanse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Exposes `FakeProbe` and `StagedSystem` so other crates' tests can stage cloud placeholders, hard
# links, owners, and elevation that are impractical to create for real.
fake = []
# The changes system cleanup makes, such as creating its private data folder. Only cleanse-exec
# turns this on (ADR 0010).
privileged = []

[dependencies]
cleanse-model.workspace = true
dirs.workspace = true
sysinfo.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_CloudFilters",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
junction.workspace = true

[lints]
workspace = true
