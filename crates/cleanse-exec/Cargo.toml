[package]
name = "cleanse-exec"
description = "Executes approved Cleanse plans: the only crate that changes the filesystem. Internal to cleanse-cli, with no stable API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `helper::Installed::unchecked`, for tests that start a copy of the elevated helper.
fake = []

[dependencies]
cleanse-core.workspace = true
cleanse-model.workspace = true
cleanse-platform = { workspace = true, features = ["privileged"] }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
cleanse-platform = { workspace = true, features = ["fake"] }
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
junction.workspace = true

[lints]
workspace = true
