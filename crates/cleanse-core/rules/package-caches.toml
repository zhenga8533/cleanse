[[rule]]
id = "npm.cache"
name = "npm download cache"
category = "package_caches"
risk = "regenerable"
explain = "Packages npm has downloaded before. npm downloads them again when an install needs them."
regenerate = "npm downloads packages again during the next install."

[rule.match]
kind = "known_location"
locations = [
    { os = "windows", base = "data_local", path = "npm-cache/_cacache" },
    { os = "macos", base = "home", path = ".npm/_cacache" },
    { os = "linux", base = "home", path = ".npm/_cacache" },
]

[[rule.test]]
os = "windows"
tree = ["data_local/npm-cache/_cacache/index-v5/00/x"]
matches = ["data_local/npm-cache/_cacache"]

[[rule.test]]
os = "macos"
tree = ["home/.npm/_cacache/index-v5/00/x"]
matches = ["home/.npm/_cacache"]

[[rule.test]]
os = "linux"
tree = ["home/.npm/_cacache/index-v5/00/x"]
matches = ["home/.npm/_cacache"]

[[rule.test]]
# The same name anywhere else isn't npm's cache.
tree = ["projects/.npm/_cacache/x"]
matches = []

[[rule]]
id = "pip.cache"
