[[rule]]
id = "cargo.registry"
name = "Cargo download cache"
category = "package_caches"
risk = "regenerable"
explain = "Crates Cargo has downloaded, and their unpacked sources. Cargo downloads them again when a build needs them."
regenerate = "Cargo downloads crates again during the next build."

[rule.match]
kind = "known_location"
locations = [
    { os = "windows", base = "home", path = ".cargo/registry/cache" },
    { os = "windows", base = "home", path = ".cargo/registry/src" },
    { os = "macos", base = "home", path = ".cargo/registry/cache" },
    { os = "macos", base = "home", path = ".cargo/registry/src" },
    { os = "linux", base = "home", path = ".cargo/registry/cache" },
    { os = "linux", base = "home", path = ".cargo/registry/src" },
]

[[rule.test]]
tree = [
    "home/.cargo/registry/cache/index.crates.io/serde.crate",
    "home/.cargo/registry/src/index.crates.io/serde/lib.rs",
    "home/.cargo/bin/cargo-nextest",
]
matches = ["home/.cargo/registry/cache", "home/.cargo/registry/src"]

[[rule.test]]
# Installed tools and the registry index aren't part of the download cache.
tree = ["home/.cargo/bin/cargo-nextest", "home/.cargo/registry/index/x"]
matches = []

[[rule]]
id = "nuget.http_cache"
name = "NuGet HTTP cache"
category = "package_caches"
risk = "regenerable"
explain = "Package metadata and downloads NuGet has cached. NuGet fetches them again when a restore needs them."
regenerate = "NuGet fetches packages again during the next restore."

[rule.match]
kind = "known_location"
locations = [
    { os = "windows", base = "data_local", path = "NuGet/v3-cache" },
    { os = "macos", base = "home", path = ".local/share/NuGet/v3-cache" },
    { os = "linux", base = "home", path = ".local/share/NuGet/v3-cache" },
]

[[rule.test]]
os = "windows"
tree = ["data_local/NuGet/v3-cache/x/list.dat"]
matches = ["data_local/NuGet/v3-cache"]

[[rule.test]]
os = "linux"
tree = ["home/.local/share/NuGet/v3-cache/x/list.dat"]
matches = ["home/.local/share/NuGet/v3-cache"]

[[rule.test]]
tree = ["projects/NuGet/v3-cache/x"]
matches = []

[[rule]]
id = "homebrew.cache"
name = "Homebrew download cache"
category = "package_caches"
risk = "regenerable"
explain = "Downloads Homebrew keeps after installing. Homebrew downloads them again if it needs them."
regenerate = "Homebrew downloads them again when needed."

[rule.match]
kind = "known_location"
locations = [
    { os = "macos", base = "cache", path = "Homebrew" },
    { os = "linux", base = "cache", path = "Homebrew" },
