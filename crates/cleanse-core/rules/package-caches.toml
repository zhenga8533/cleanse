tree = ["cache/pip/http-v2/x"]
matches = ["cache/pip"]

[[rule.test]]
os = "linux"
tree = ["cache/pip/http-v2/x"]
matches = ["cache/pip"]

[[rule.test]]
tree = ["projects/pip/x"]
matches = []

