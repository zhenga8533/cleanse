name = "Old Claude Code folders"
category = "ai_agents"
risk = "safe"
explain = "Folders that older versions of Claude Code wrote. Current versions no longer use them."

[rule.match]
kind = "known_location"
locations = [
    { os = "windows", base = "home", path = ".claude/image-cache" },
    { os = "macos", base = "home", path = ".claude/image-cache" },
    { os = "linux", base = "home", path = ".claude/image-cache" },
    { os = "windows", base = "home", path = ".claude/logs" },
    { os = "macos", base = "home", path = ".claude/logs" },
    { os = "linux", base = "home", path = ".claude/logs" },
    { os = "windows", base = "home", path = ".claude/statsig" },
    { os = "macos", base = "home", path = ".claude/statsig" },
    { os = "linux", base = "home", path = ".claude/statsig" },
    { os = "windows", base = "home", path = ".claude/todos" },
    { os = "macos", base = "home", path = ".claude/todos" },
    { os = "linux", base = "home", path = ".claude/todos" },
]

[rule.owner]
app = "Claude Code"
processes = ["claude"]

[[rule.test]]
tree = [
    "home/.claude/image-cache/x",
    "home/.claude/logs/x",
    "home/.claude/statsig/x",
    "home/.claude/todos/x",
]
matches = [
    "home/.claude/image-cache",
    "home/.claude/logs",
    "home/.claude/statsig",
    "home/.claude/todos",
]

[[rule.test]]
tree = [
    "home/.claude/projects/p/s.jsonl",
    "code/.claude/image-cache/x",
    "code/.claude/logs/x",
    "code/.claude/statsig/x",
    "code/.claude/todos/x",
]
matches = []

