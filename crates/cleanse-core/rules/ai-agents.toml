# Claude Code keeps its data in ~/.claude. These rules match only the folders its documentation
# says can be deleted (https://code.claude.com/docs/en/claude-directory), which the protected
# policy exempts from protecting ~/.claude. Everything else there stays protected: transcripts,
# memory, prompt history, tasks, settings, plugins, and credentials. Claude Code also deletes
# most of these itself once they're older than its cleanupPeriodDays setting.

[[rule]]
id = "claude-code.cache"
name = "Claude Code cache"
category = "ai_agents"
risk = "safe"
explain = "Caches Claude Code keeps, such as its copy of the changelog. It refreshes them on its own."
regenerate = "Claude Code refills it in the background."

[rule.match]
kind = "known_location"
locations = [
    { os = "windows", base = "home", path = ".claude/cache" },
    { os = "macos", base = "home", path = ".claude/cache" },
    { os = "linux", base = "home", path = ".claude/cache" },
]

[rule.owner]
app = "Claude Code"
processes = ["claude"]

[[rule.test]]
tree = ["home/.claude/cache/x"]
matches = ["home/.claude/cache"]

[[rule.test]]
tree = ["home/.claude/projects/p/s.jsonl", "code/.claude/cache/x"]
matches = []

