# Builds the desktop app's installers, which dist doesn't make: Tauri does. The release workflow
# runs this beside dist's own builds (`local-artifacts-jobs` in dist-workspace.toml), and its
# release step uploads every `artifacts-*` artifact, so the installers land on the release with
# the CLI's archives. It also runs on pull requests that change how the app is packaged, and by
# hand, to check the builds without releasing.
name: Desktop installers

on:
  workflow_call:
    inputs:
      plan:
        description: dist's plan, as JSON. The builds don't need it.
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/desktop-installers.yml
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/icons/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Desktop installer (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
            build: --bundles msi
            bundles: target/release/bundle/msi/*.msi
          # One disk image for Apple silicon and Intel Macs. It's ad-hoc signed (`signingIdentity`
          # in tauri.conf.json), since Apple silicon calls an unsigned download damaged and
          # won't open it. Signing with a Developer ID waits for M5.
          - name: macos
            runner: macos-15
            build: --bundles dmg --target universal-apple-darwin
            bundles: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          # The oldest Ubuntu runner, so the AppImage and deb need no newer a glibc than it has.
          - name: linux
            runner: ubuntu-22.04
            build: --bundles appimage,deb
            bundles: target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Add the Mac targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # https://tauri.app/start/prerequisites/#linux, and patchelf for the AppImage.
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm --dir apps/desktop install --frozen-lockfile
      - name: Build
        run: pnpm --dir apps/desktop tauri build ${{ matrix.build }}
      - name: Collect the installers and their checksums
        run: |
          mkdir installers
          cp ${{ matrix.bundles }} installers/
          cd installers
          for file in *; do
            # The same format as dist's checksums for the CLI's archives.
            if [ "$RUNNER_OS" = macOS ]; then
              shasum -a 256 -b "$file" > "$file.sha256"
            else
              sha256sum --binary "$file" > "$file.sha256"
            fi
          done
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-desktop-${{ matrix.name }}
          path: installers/
          if-no-files-found: error

  # Only for releases, so the builds above, and pull requests, run with a read-only token.
  attest:
    name: Attest desktop installers
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-desktop-*
          path: installers
          merge-multiple: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            installers/*.msi
            installers/*.dmg
            installers/*.AppImage
            installers/*.deb
