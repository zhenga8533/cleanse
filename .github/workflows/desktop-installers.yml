# Builds the desktop app's installers, which dist doesn't make: Tauri does. The release workflow
# runs this beside dist's own builds (`local-artifacts-jobs` in dist-workspace.toml), and its
# release step uploads every `artifacts-*` artifact, so the installers land on the release with
# the CLI's archives. It also runs on pull requests that change how the app is packaged, and by
# hand, to check the builds without releasing.
name: Desktop installers

on:
  workflow_call:
    inputs:
      plan:
        description: dist's plan, as JSON. The builds don't need it.
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/desktop-installers.yml
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/icons/**
      - apps/desktop/src-tauri/installer/**
      - apps/elevate/build.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Desktop installer (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The MSI and the deb carry the elevated helper, which does system cleanup for the app
          # (ADR 0010), as `src-tauri/installer/` adds it. Only installers do: every build of the
          # app would need the helper built first if `tauri.conf.json` named it.
          - name: windows
            runner: windows-latest
            build: --bundles msi --config src-tauri/installer/windows.json
            bundles: target/release/bundle/msi/*.msi
            helper: true
          # One disk image for Apple silicon and Intel Macs. It's ad-hoc signed (`signingIdentity`
          # in tauri.conf.json), since Apple silicon calls an unsigned download damaged and
          # won't open it. Signing with a Developer ID waits for M5.
          - name: macos
            runner: macos-15
            build: --bundles dmg --target universal-apple-darwin
            bundles: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          # The oldest Ubuntu runner, so the AppImage and deb need no newer a glibc than it has.
          - name: linux
            runner: ubuntu-22.04
            build: --bundles appimage,deb --config src-tauri/installer/linux.json
            bundles: target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb
            helper: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Add the Mac targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # https://tauri.app/start/prerequisites/#linux, and patchelf for the AppImage.
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm --dir apps/desktop install --frozen-lockfile
      - name: Build the elevated helper
        if: matrix.helper
        run: cargo xtask helper
      - name: Build
        run: pnpm --dir apps/desktop tauri build ${{ matrix.build }}
      # Installed as a user's would be, the helper is beside the app in Program Files, where the
      # app looks for it, and runs from there.
      - name: Check the MSI installs the helper beside the app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem target/release/bundle/msi/*.msi)[0].FullName
          $installed = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($installed.ExitCode -ne 0) { Get-Content install.log -Tail 40; exit 1 }
          $folder = Join-Path $env:ProgramFiles Cleanse
          foreach ($program in "cleanse-desktop.exe", "cleanse-elevate.exe") {
            if (-not (Test-Path (Join-Path $folder $program))) { throw "$program isn't in $folder" }
          }
          icacls (Join-Path $folder cleanse-elevate.exe)
          # Without the window's arguments, it says how the app starts it. It's a Windows program,
          # with no console, so it's waited for, and its standard error read from a file.
          $ran = Start-Process (Join-Path $folder cleanse-elevate.exe) -Wait -PassThru -NoNewWindow -RedirectStandardError helper.txt
          $said = Get-Content helper.txt -Raw
          Write-Output $said
          if ($ran.ExitCode -ne 1 -or $said -notmatch '--pipe <name> --parent') { throw "the installed helper didn't run" }
          $removed = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          exit $removed.ExitCode
      # The deb installs the helper and polkit's policy where the app looks for them, owned by
      # root, and the AppImage, which can't offer system cleanup, carries neither.
      - name: Check the deb has the helper and the AppImage doesn't
        if: runner.os == 'Linux'
        run: |
          dpkg-deb -c target/release/bundle/deb/*.deb | tee contents.txt
          grep -E '^drwxr-xr-x root/root .* \./usr/lib/cleanse/$' contents.txt
          grep -E '^-rwxr-xr-x root/root .* \./usr/lib/cleanse/cleanse-elevate$' contents.txt
          grep -E '^-rw-r--r-- root/root .* \./usr/share/polkit-1/actions/io\.github\.zhenga8533\.cleanse\.policy$' contents.txt
          appimage=$(realpath target/release/bundle/appimage/*.AppImage)
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract > /dev/null)
          if find "$RUNNER_TEMP/squashfs-root" -name 'cleanse-elevate*' -o -name '*.policy' | grep .; then
            echo "the AppImage carries the helper"
            exit 1
          fi
      - name: Collect the installers and their checksums
        run: |
          mkdir installers
          cp ${{ matrix.bundles }} installers/
          cd installers
          for file in *; do
            # The same format as dist's checksums for the CLI's archives.
            if [ "$RUNNER_OS" = macOS ]; then
              shasum -a 256 -b "$file" > "$file.sha256"
            else
              sha256sum --binary "$file" > "$file.sha256"
            fi
          done
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-desktop-${{ matrix.name }}
          path: installers/
          if-no-files-found: error

  # Only for releases, so the builds above, and pull requests, run with a read-only token.
  attest:
    name: Attest desktop installers
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-desktop-*
          path: installers
          merge-multiple: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            installers/*.msi
            installers/*.dmg
            installers/*.AppImage
            installers/*.deb
