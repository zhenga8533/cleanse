paths:
  # Generated by `dist generate`; hand edits fail dist's up-to-date check. Its
  # unquoted variables are runner paths and $PRERELEASE_FLAG, which must stay
  # unquoted so that an empty value passes no argument.
  .github/workflows/release.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2086:info:.+'
      - 'shellcheck reported issue in this script: SC2129:style:.+'
