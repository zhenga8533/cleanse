# Only cleanse-exec (and, later, the elevated helper) may change the filesystem or spawn
# processes. Anything else that genuinely needs one of these must opt in locally with
# `#[allow(clippy::disallowed_methods, reason = "...")]`. See docs/src/adr/0002-single-mutator.md.
disallowed-methods = [
    { path = "std::fs::remove_file", reason = "only cleanse-exec may delete (ADR 0002)" },
    { path = "std::fs::remove_dir", reason = "only cleanse-exec may delete (ADR 0002)" },
    { path = "std::fs::remove_dir_all", reason = "only cleanse-exec may delete (ADR 0002)" },
    { path = "cleanse_platform::privileged::Folder::remove_file", reason = "only cleanse-exec may delete (ADR 0002)", allow-invalid = true },
    { path = "cleanse_platform::privileged::Folder::remove_folder", reason = "only cleanse-exec may delete (ADR 0002)", allow-invalid = true },
    { path = "std::fs::rename", reason = "only cleanse-exec may move files (ADR 0002)" },
    { path = "std::fs::copy", reason = "only cleanse-exec may write files (ADR 0002)" },
    { path = "std::fs::write", reason = "only cleanse-exec may write files (ADR 0002)" },
    { path = "std::fs::File::create", reason = "only cleanse-exec may write files (ADR 0002)" },
    { path = "std::fs::set_permissions", reason = "only cleanse-exec may change permissions (ADR 0002)" },
    { path = "std::fs::create_dir", reason = "only cleanse-exec may write files (ADR 0002)" },
    { path = "std::fs::create_dir_all", reason = "only cleanse-exec may write files (ADR 0002)" },
    { path = "std::fs::hard_link", reason = "only cleanse-exec may write files (ADR 0002)" },
    { path = "std::fs::OpenOptions::write", reason = "only cleanse-exec may write files (ADR 0002)" },
    { path = "std::fs::OpenOptions::append", reason = "only cleanse-exec may write files (ADR 0002)" },
    { path = "std::fs::OpenOptions::truncate", reason = "only cleanse-exec may write files (ADR 0002)" },
    { path = "std::fs::OpenOptions::create", reason = "only cleanse-exec may write files (ADR 0002)" },
    { path = "std::fs::OpenOptions::create_new", reason = "only cleanse-exec may write files (ADR 0002)" },
    { path = "std::fs::File::set_len", reason = "only cleanse-exec may write files (ADR 0002)" },
    { path = "std::fs::File::set_modified", reason = "only cleanse-exec may write files (ADR 0002)" },
    { path = "std::fs::File::set_times", reason = "only cleanse-exec may write files (ADR 0002)" },
    { path = "std::fs::File::set_permissions", reason = "only cleanse-exec may change permissions (ADR 0002)" },
    { path = "std::fs::DirBuilder::create", reason = "only cleanse-exec may write files (ADR 0002)" },
    { path = "std::os::unix::fs::symlink", reason = "only cleanse-exec may write files (ADR 0002)", allow-invalid = true },
    { path = "std::os::unix::fs::chown", reason = "only cleanse-exec may change ownership (ADR 0002)", allow-invalid = true },
    { path = "std::os::unix::fs::fchown", reason = "only cleanse-exec may change ownership (ADR 0002)", allow-invalid = true },
    { path = "std::os::unix::fs::lchown", reason = "only cleanse-exec may change ownership (ADR 0002)", allow-invalid = true },
    { path = "std::os::windows::fs::symlink_file", reason = "only cleanse-exec may write files (ADR 0002)", allow-invalid = true },
    { path = "std::os::windows::fs::symlink_dir", reason = "only cleanse-exec may write files (ADR 0002)", allow-invalid = true },
    { path = "std::process::Command::new", reason = "rules never run commands; only cleanse-exec may spawn processes (ADR 0003)" },
    { path = "cleanse_platform::privileged::create_private_dir", reason = "only cleanse-exec creates system cleanup's data folder (ADR 0010)", allow-invalid = true },
    { path = "cleanse_platform::privileged::run_as_administrator", reason = "only cleanse-exec starts the elevated helper (ADR 0010)", allow-invalid = true },
    { path = "cleanse_platform::privileged::pipe::serve", reason = "only the elevated helper makes its pipes (ADR 0010)", allow-invalid = true },
    { path = "cleanse_platform::privileged::pipe::connect", reason = "only cleanse-exec connects to the elevated helper (ADR 0010)", allow-invalid = true },
]

allow-unwrap-in-tests = true
doc-valid-idents = ["AppImage", "OneDrive", "ReFS", "WebView2", ".."]
