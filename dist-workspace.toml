[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# The tap the Homebrew formula goes to, which makes the release notes say
# `brew install zhenga8533/tap/cleanse-cli`. publish-homebrew.yml publishes it, not dist's own
# Homebrew job, so `dist plan` warns that the job is off.
tap = "zhenga8533/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Publish SLSA build provenance for every artifact
github-attestations = true
# The desktop app's installers, which Tauri builds rather than dist. See the workflow.
local-artifacts-jobs = ["./desktop-installers"]
# Build only the packages dist ships, the CLI, rather than the whole workspace: the desktop app
# needs GTK's development files to compile on Linux, which the CLI's runners don't have.
precise-builds = true
# Once the GitHub Release exists, these publish the CLI and its crates to crates.io, and its
# formula to the Homebrew tap. See the workflows.
publish-jobs = ["./publish-crates", "./publish-homebrew"]

# Pin the generated workflow's actions by commit, like the other workflows.
# Dependabot bumps to release.yml fail dist's up-to-date check until the
# matching pin here is updated and `dist generate` is rerun.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"          # v7.0.1
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"   # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"            # v4.2.2

# dist 0.32.0 builds this target on macos-14, which GitHub retired on 2026-11-02:
# https://github.com/actions/runner-images/issues/13518
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"

# The desktop installers' job attests what it builds, as dist does for the CLI. Publishing to
# crates.io trades the job's OIDC token for a short-lived crates.io token (trusted publishing).
# The Homebrew job writes only to the tap, with the tap's own token.
[dist.github-custom-job-permissions]
"desktop-installers" = { contents = "read", attestations = "write", id-token = "write" }
"publish-crates" = { contents = "read", id-token = "write" }
"publish-homebrew" = { contents = "read" }
