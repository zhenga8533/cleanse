[package]
name = "cleanse-elevate"
description = "The Cleanse desktop app's elevated helper, which does system cleanup for its window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The desktop app's installers carry it, not dist.
[package.metadata.dist]
dist = false

# On Windows its manifest asks for an administrator, which a test build of it would too, so it
# has none: tests/program.rs runs the program itself.
[[bin]]
name = "cleanse-elevate"
path = "src/main.rs"
test = false

[dependencies]
cleanse-desktop-views.workspace = true
cleanse-engine.workspace = true
cleanse-model.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
cleanse-platform = { workspace = true, features = ["privileged"] }

[build-dependencies]
static_vcruntime.workspace = true

[dev-dependencies]
cleanse-engine = { workspace = true, features = ["fake"] }
tempfile.workspace = true

[lints]
workspace = true
