[package]
name = "cleanse-desktop"
description = "The Cleanse desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Tauri builds and bundles the app, not dist.
[package.metadata.dist]
dist = false

[dependencies]
cleanse-desktop-views.workspace = true
cleanse-elevate.workspace = true
cleanse-engine.workspace = true
cleanse-model.workspace = true
# The system's folder picker, without Tauri's dialog plugin, which would also bring in its file
# system plugin. GTK on Linux, as Tauri uses.
rfd = { workspace = true, features = ["common-controls-v6", "gtk3"] }
serde.workspace = true
tauri = { workspace = true, features = ["isolation"] }
ts-rs.workspace = true

[build-dependencies]
tauri-build = { workspace = true, features = ["isolation"] }

[dev-dependencies]
cleanse-engine = { workspace = true, features = ["fake"] }
serde_json.workspace = true
tauri = { workspace = true, features = ["test"] }
tempfile.workspace = true

[lints]
workspace = true
