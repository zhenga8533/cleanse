[workspace]
resolver = "3"
members = ["apps/cli", "crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zhenga8533/cleanse"

[workspace.dependencies]
cleanse-core = { path = "crates/cleanse-core", version = "0.1.0" }
cleanse-engine = { path = "crates/cleanse-engine", version = "0.1.0" }
cleanse-exec = { path = "crates/cleanse-exec", version = "0.1.0" }
cleanse-model = { path = "crates/cleanse-model", version = "0.1.0" }
cleanse-platform = { path = "crates/cleanse-platform", version = "0.1.0" }

clap = { version = "4.5", features = ["derive"] }
dirs = "7.0"
gix = { version = "0.90", default-features = false }
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
rayon = "1.12"
rustix = "1.1"
serde = { version = "1.0", features = ["derive"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
toml = "1.1"
windows-sys = "0.61"

junction = "2.1"
proptest = "1.12"
serde_json = "1.0"
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
