[graph]
all-features = true
# The platforms Cleanse ships for. Tauri depends on an HTTP client only on iOS and Android, so
# checking every target would flag crates the desktop app never builds.
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained. Only gtk-rs's GTK3 macros (glib-macros, gtk3-macros) use it, at build time, for the WebKitGTK web view Tauri uses on Linux." },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# The allow-list anticipates planned dependencies; unused entries aren't a problem.
unused-allowed-license = "allow"

# File-level copyleft: it applies to option-ext's own files, which we use unmodified, and not to
# Cleanse. It comes in through dirs-sys, which `dirs` uses for known-folder lookup.
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

# The same kind of file-level copyleft: Servo's CSS parser, which only Tauri's proc macros use,
# to process the app's HTML while it's compiled. None of it is linked into the app.
[[licenses.exceptions]]
crate = "cssparser"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "cssparser-macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "dtoa-short"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "selectors"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # The engine and CLI never touch the network (ADR 0005).
    { crate = "reqwest", reason = "no network access (ADR 0005)" },
    { crate = "hyper", reason = "no network access (ADR 0005)" },
    { crate = "ureq", reason = "no network access (ADR 0005)" },
    { crate = "curl", reason = "no network access (ADR 0005)" },
    # Git inspection uses gix: libgit2 brings C and OpenSSL dependencies.
    { crate = "git2", reason = "use gix instead" },
    { crate = "openssl-sys", reason = "no C TLS stack" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
